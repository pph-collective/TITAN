partner_tracing:
  exposure:
    description: "Which exposure is being partner traced"
    type: enum
    default: hiv
    values:
      - hiv
  prob:
    default: 1.0
    description: Probability that an agent whose partner is diagnosed with hiv will become traced
    type: float
    min: 0.
    max: 1.
  dx_prob:
    default: .947
    description: Probability that an agent who is traced and has the exposure gets diagnosed with the exposure - default is  TP / (TP + FN)
    type: float
    min: 0
    max: 1
  bond_type:
    description: "What type of partnerships are traced"
    type: array
    class: bond_types
    default:
      - Sex
      - Inj
      - SexInj
  start_time:
    description: "What time step to start partner tracing"
    type: int
    default: -12
  stop_time:
    description: "What time step to stop partner tracing"
    type: int
    default: 9999
  trace_duration:
    description: "For how many time steps after partner diagnosis a partner is traced"
    type: int
    default: 1
  participate_prob:
    description: Probability that a given agent is willing to participate in the partner services program
    type: float
    default: 
      white: 0.630
      black: 0.561
      latino: 0.580
    min: 0
    max: 1
  tracing_prob: 
    description: Probability of tracing a partner based on the amount of information provided by agent
    type: float
    default: 0.66 # to be calibrated
    min: 0
    max: 1
  contact_prob:
    description: Probability that a named partner will be contacted
    type: float
    default:
     white: 0.7
     black: 0.69
     latino: 0.75
    min: 0  
    max: 1
  partner_participate_prob:
    description: Probability that a contacted partner will participate in the PS and get tested
    type: float
    default:
      white: 0.658
      black: 0.576
      latino: 0.634
    min: 0
    max: 1
  treatment_prob:
    description: Probability that a partner who has been diagnosed through PS will receive treatment
    type: float
    default: 0.82
    min: 0
    max: 1
  prep_prob:
    description: Probability that a partner who tested negative for HIV through PS will be referred to prep
    type: float
    default:
      white: 0.49
      black: 0.5
      latino: 0.4
    min: 0
    max: 1  
  re_haart_prob:
    description: Probability that a traced agent who has been previously diagnosed and not on haart reengages/engages haart
    type: float
    default: 0.549
    min: 0
    max: 1  
